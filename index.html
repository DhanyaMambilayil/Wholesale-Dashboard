<!--
  =====================================================================
  ABOUT THIS FILE — v2: real data, fetched from CSV files
  =====================================================================
  This version no longer embeds data in the HTML. It fetches CSV files
  from a sibling "data/" folder at load time, so updating the numbers
  is just: edit a CSV, commit, push. See the README / chat instructions
  for exact GitHub steps.

  EXPECTED FILES (relative to this HTML file):
    data/bec-2025.csv                 (BEC Head Office / Wholesale, frozen)
    data/bec-2026.csv                 (BEC Head Office / Wholesale, growing)
    data/bec-branches-2025.csv        (BEC branch network, frozen)
    data/bec-branches-2026.csv        (BEC branch network, growing)
    data/ansari-2026.csv              (Ansari, real May 1 – Jul 24 2026 so far)
    data/ansari-gross-profit-manual.csv (Ansari Gross Profit, filled in by hand, monthly)

  IMPORTANT CAVEATS — please read:
  1. This dashboard now shows REAL figures wherever real data exists,
     and clearly marks "N/A" / "partial" where it doesn't — it no
     longer fabricates placeholder numbers the way earlier versions
     did, since that would be misleading for a live operational tool.
  2. BEC is fully real for both 2025 and 2026 — so MTD, YTD, MoM, and
     YoY are all genuine computed comparisons for BEC.
  3. Ansari only has real data from 1 May 2026 onward. There's no 2025
     Ansari data and no Jan–Apr 2026 data, so: MTD and MoM are real
     (since the current month and the prior month are both covered);
     YTD only reflects May 1 onward (labelled "partial year"); YoY is
     not available at all (shown as N/A) until 2025 data is provided.
  4. Ansari has no real Gross Profit / commission data (near-zero in
     the source report), so Gross Profit for Ansari comes entirely
     from the manual monthly file. If a month hasn't been filled in
     yet, it's excluded and the figure is labelled "partial".
  5. BEC's branch network (from branches_fx_dump.xlsx) has no area/
     region grouping provided, so the Area dropdown only applies to
     Ansari; for BEC it just offers "All Branches" plus each branch
     code directly (e.g. AIR, T5A, MB2 — these are BEC's own branch
     codes, not the SHABIR/SAKEER/ANOOP structure used for Ansari).
  6. Ansari has no real Buy-side transactions (FCY-Sale report only),
     so selecting "Buy" alone for Ansari will correctly show empty /
     zero — that's accurate, not a bug.
  7. This file must be served over http(s) to fetch the CSVs — opening
     it directly as a local file (file://) will fail due to browser
     CORS restrictions. Use GitHub Pages, a local dev server, etc.
  =====================================================================
-->

<style>

    --bg:#181F39; --panel:#1E2746; --ink:#EAEFF9; --ink-soft:#8891AC; --line:#2A3560;

    --purple:#00AFEF; --purple-soft:#123449;

  .title-block h1{
    font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-0.02em;margin:0 0 4px;
    color:#001844;text-shadow:0 0 1px #fff, 0 0 14px rgba(255,255,255,.55);
  }
  .title-block p{margin:0;color:var(--ink-soft);font-size:14px;}
  .badge{
    display:inline-flex;align-items:center;gap:8px;background:var(--gold-soft);color:var(--gold);
    border:1px solid #1E5C4A;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;
  }

  .note{background:var(--accent-soft);border:1px solid #2E3E5C;color:var(--ink);border-radius:var(--radius);padding:13px 16px;font-size:13px;line-height:1.55;margin-bottom:22px;}
  .note b{font-weight:700;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab-btn{
    border:1px solid #001844;background:#fff;color:#001844;
    font-family:var(--display);font-weight:600;font-size:14px;
    padding:11px 22px;border-radius:999px;cursor:pointer;
  }
  .tab-btn.active{background:#001844;color:#fff;border-color:#001844;box-shadow:0 0 26px rgba(58,122,254,.45);}

  /* ---- Cards ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:0 2px 14px rgba(0,27,84,.05);}
  .card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
  .card .value{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-0.01em;}
  .card .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .card .sub.up{color:var(--positive);}
  .card .sub.down{color:var(--red);}

  .card.grad-0{background:#3A7AFE;border-color:transparent;box-shadow:0 0 26px rgba(58,122,254,.40);}
  .card.grad-1{background:#10CA93;border-color:transparent;box-shadow:0 0 26px rgba(16,202,147,.35);}
  .card.grad-2{background:#00AFEF;border-color:transparent;box-shadow:0 0 26px rgba(0,175,239,.35);}
  .card.grad-3{background:#7C5CFC;border-color:transparent;box-shadow:0 0 26px rgba(124,92,252,.35);}
  .card.grad-4{background:#5B8FBF;border-color:transparent;box-shadow:0 0 26px rgba(91,143,191,.30);}
  .card[class*="grad-"] .label{color:rgba(255,255,255,.78);}
  .card[class*="grad-"] .value{color:#fff;}
  .card[class*="grad-"] .sub{color:rgba(255,255,255,.75);}
  .card[class*="grad-"] .sub.up{color:#082418;font-weight:700;}
  .card[class*="grad-"] .sub.down{color:#2E0808;font-weight:700;}

  /* ---- Panels ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .panel h2{font-family:var(--display);font-size:19px;font-weight:700;color:var(--orange);text-shadow:0 0 14px rgba(255,138,61,.45);letter-spacing:-0.01em;margin:0 0 16px;padding-left:12px;border-left:4px solid var(--orange);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .panel h2.accordion-head{cursor:pointer;margin:0;}
  .accordion-icon{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--orange);color:#3A1F00;font-size:16px;font-weight:700;
    box-shadow:0 0 14px rgba(255,138,61,.5);

  .panel-body.collapsed{display:none;}

  .chart-wrap{position:relative;height:300px;}
  .chart-wrap.tall{height:340px;}

  /* ---- Leaderboard ---- */
  .lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .lb-col-title{font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
  .lb-card{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;
    border:1px solid var(--line);margin-bottom:10px;background:var(--panel);

  .lb-card.rank-2{box-shadow:0 0 16px rgba(0,27,84,.10);}

  thead th:first-child{text-align:left;}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink);}
  tbody td:first-child{text-align:left;font-family:var(--sans);font-weight:600;}
  tbody tr:hover td{background:var(--accent-soft);}
  tbody tr.total-row td{background:#1A2338;font-weight:700;}
  tbody tr:last-child td{border-bottom:none;}

  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:32px;}

  /* ---- Segmentation ---- */
  .seg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .seg-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;transition:box-shadow .15s ease;}
  .seg-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;}
  .seg-card-title{font-family:var(--display);font-weight:700;font-size:15px;}
  .seg-card-desc{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
  .seg-card-right{text-align:right;flex-shrink:0;}
  .seg-card-count{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink);}
  .seg-card-vol{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .filter-select{
    background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; font-family:var(--sans); font-size:12.5px; font-weight:600; margin-right:8px;

  .load-spinner{ width:36px; height:36px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error-box{ background:#3A1F26; border:1px solid #7A2E3A; color:#FFC9CE; padding:16px 20px; border-radius:10px; font-family:var(--sans); font-size:13px; line-height:1.6; max-width:640px; }
  .na-text{ color:var(--ink-soft); font-style:italic; }

</style>
</head>

<script>

function fetchCSV(path){
  return new Promise((resolve, reject) => {
    Papa.parse(path, {
      download: true,
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: (res) => resolve(res.data),
      error: (err) => reject(new Error(path + ': ' + err))
    });
  });
}

  '5109': { name: 'Mahboula 3',        area: 'ANOOP AREA' },
  '5112': { name: 'Mahboula 5',        area: 'ANOOP AREA' },
  '6102': { name: 'Jahra',             area: 'ANOOP AREA' },
  '6103': { name: 'Abdali',            area: 'ANOOP AREA' },
  '6104': { name: 'Jahra 2',           area: 'ANOOP AREA' },
  '6105': { name: 'Abdali 2',          area: 'ANOOP AREA' }
};

let DATA = [];               // unified real transaction rows
let ANSARI_MONTHLY_GP = {};  // 'YYYY-MM' -> number|null
let BEC_BRANCH_LIST = [];    // [{code,name}]
let CUR_LIST_BY_ENTITY = { bec: [], ansari: [] };

function normalizeBecRow(row, isHO){
  if (!row.date || !row.type) return null;
  return {
    date: row.date, entity: 'bec', code: isHO ? 'WSL' : row.branch_code,
    isHO, type: String(row.type).toLowerCase(),
    cur: row.currency, amt: Number(row.volume_kwd) || 0,
    profit: Number(row.gross_profit_kwd) || 0
  };
}

function normalizeAnsariRow(row){
  if (!row.date || !row.branch_code) return null;
  const code = String(row.branch_code);
  return {
    date: row.date, entity: 'ansari', code,
    isHO: code === '9999', type: 'sell',
    cur: row.currency, amt: Number(row.volume_kwd) || 0,
    profit: null // filled in from monthly manual file at aggregation time
  };
}

async function loadAll(){
  try {
    const [becHo25, becHo26, becBr25, becBr26, ansari26, ansariGP] = await Promise.all([
      fetchCSV(CSV_FILES.becHo2025), fetchCSV(CSV_FILES.becHo2026),
      fetchCSV(CSV_FILES.becBr2025), fetchCSV(CSV_FILES.becBr2026),
      fetchCSV(CSV_FILES.ansari2026), fetchCSV(CSV_FILES.ansariGP)
    ]);

    const rows = [];
    becHo25.forEach(r => { const n = normalizeBecRow(r, true); if (n) rows.push(n); });
    becHo26.forEach(r => { const n = normalizeBecRow(r, true); if (n) rows.push(n); });
    becBr25.forEach(r => { const n = normalizeBecRow(r, false); if (n) rows.push(n); });
    becBr26.forEach(r => { const n = normalizeBecRow(r, false); if (n) rows.push(n); });
    ansari26.forEach(r => { const n = normalizeAnsariRow(r); if (n) rows.push(n); });
    DATA = rows;

    ansariGP.forEach(r => {
      if (!r.month) return;
      const v = r.gross_profit_kwd;
      ANSARI_MONTHLY_GP[String(r.month)] = (v === '' || v === null || v === undefined) ? null : Number(v);
    });

    const becCodes = new Set();
    DATA.forEach(r => { if (r.entity === 'bec' && !r.isHO) becCodes.add(r.code); });
    BEC_BRANCH_LIST = [...becCodes].sort().map(code => ({ code, name: code }));

    ['bec','ansari'].forEach(ent => {
      CUR_LIST_BY_ENTITY[ent] = [...new Set(DATA.filter(r => r.entity === ent).map(r => r.cur))]
        .sort((a,b) => {
          const va = DATA.filter(r => r.entity===ent && r.cur===a).reduce((s,r)=>s+r.amt,0);
          const vb = DATA.filter(r => r.entity===ent && r.cur===b).reduce((s,r)=>s+r.amt,0);
          return vb - va;
        });
    });

    document.getElementById('loadScreen').style.display = 'none';
    document.getElementById('dashboardRoot').style.display = '';
    renderAll();
  } catch (err) {
    document.getElementById('loadScreen').style.display = 'none';
    const el = document.getElementById('errorScreen');
    el.style.display = '';
    el.innerHTML = `<div class="error-box">
      <b>Couldn't load the data files.</b><br><br>
      ${err.message}<br><br>
      Make sure this HTML file is served over http(s) (e.g. GitHub Pages) — opening it
      directly as a local file won't work due to browser security restrictions — and that
      a <code>data/</code> folder with the CSV files sits next to this file.
    </div>`;
  }
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function fmtCurrency(v){ return v.toLocaleString(undefined, { maximumFractionDigits: 0 }); }
function fmtPct(n){
  if (n === null || n === undefined || isNaN(n)) return 'N/A';
  const sign = n > 0 ? '+' : '';
  return sign + n.toFixed(1) + '%';
}
function branchNameFor(entity, code){
  if (entity === 'ansari') return (ANSARI_BRANCH_META[code] || {}).name || code;
  return code;
}
function branchAreaFor(entity, code){
  if (entity === 'ansari') return (ANSARI_BRANCH_META[code] || {}).area || null;
  return null;
}
function branchListFor(entity){
  if (entity === 'ansari') {
    return Object.keys(ANSARI_BRANCH_META).filter(c => c !== '9999')
      .map(code => ({ code, name: ANSARI_BRANCH_META[code].name, area: ANSARI_BRANCH_META[code].area }));
  }
  return BEC_BRANCH_LIST.map(b => ({ code: b.code, name: b.name, area: null }));
}
function entityHasAreas(entity){ return entity === 'ansari'; }
function entityHasBuy(entity){ return entity === 'bec'; }

function codesForAreaFilter(entity, filter){
  const list = branchListFor(entity);
  if (filter === 'ALL') return list.map(b => b.code);
  if (AREA_LIST.includes(filter)) return list.filter(b => b.area === filter).map(b => b.code);
  return [filter];
}

const METRIC_META = {
  amt:    { label: 'Volume (KWD)',       fmt: v => fmtCurrency(v) },
  count:  { label: 'Transactions',       fmt: v => Math.round(v).toLocaleString() },
  profit: { label: 'Gross Profit (KWD)', fmt: v => (v === null ? 'N/A' : fmtCurrency(v)) }
};

// Ansari has no real per-transaction profit and only a monthly manual
// aggregate, so per-currency/per-branch/per-day Gross Profit breakdowns
// aren't meaningful for Ansari — only offer it as a metric for BEC.
function metricOptionsFor(entity){
  return entity === 'bec'
    ? [['amt','Volume'], ['count','Transactions'], ['profit','Gross Profit']]
    : [['amt','Volume'], ['count','Transactions']];
}

/* Latest date present for an entity's current (2026) data. */
function latestDateFor(entity){
  let max = null;
  DATA.forEach(r => {
    if (r.entity !== entity) return;
    if (r.date.slice(0,4) !== '2026') return;
    if (max === null || r.date > max) max = r.date;
  });
  return max;
}

function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); } // m is 1-12

function monthKey(y, m){ return y + '-' + String(m).padStart(2,'0'); }

/* period: 'mtd' | 'ytd' -> { start: 'YYYY-MM-DD', end: 'YYYY-MM-DD' } based on the
   entity's own latest available date. */
function periodRange(entity, period){
  const today = latestDateFor(entity);
  if (!today) return null;
  const [y, m, d] = today.split('-').map(Number);
  if (period === 'mtd') return { start: monthKey(y,m) + '-01', end: today };
  return { start: y + '-01-01', end: today };
}

function prevMonthRange(entity){
  const today = latestDateFor(entity);
  if (!today) return null;
  let [y, m] = today.split('-').map(Number);
  m -= 1; if (m === 0){ m = 12; y -= 1; }
  return { start: monthKey(y,m) + '-01', end: monthKey(y,m) + '-' + String(daysInMonth(y,m)).padStart(2,'0') };
}

// Branches that actually had at least one real transaction within a given
// date range (excludes Head Office). Used for the "Branch Locations" card
// so the count reflects who's actually active, not just every code ever
// seen historically.
function activeBranchesFor(entity, range){
  const known = branchListFor(entity);
  if (!range) return known;
  const active = new Set();
  DATA.forEach(r => {
    if (r.entity !== entity || r.isHO) return;
    if (r.date < range.start || r.date > range.end) return;
    active.add(r.code);
  });
  return known.filter(b => active.has(b.code));
}

function prevYearSameRange(entity, period){
  const range = periodRange(entity, period);
  if (!range) return null;
  const shift = s => { const [y,m,d] = s.split('-').map(Number); return (y-1) + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); };
  return { start: shift(range.start), end: shift(range.end) };
}

function filterRows(rows, { entity, codes, cur, types, start, end }){
  return rows.filter(r => {
    if (entity && r.entity !== entity) return false;
    if (codes && !codes.includes(r.code)) return false;
    if (cur && r.cur !== cur) return false;
    if (types && !types.includes(r.type)) return false;
    if (start && r.date < start) return false;
    if (end && r.date > end) return false;
    return true;
  });
}

/* Real aggregate: amt, count. Profit handled per-entity (BEC = real sum,
   Ansari = looked up from the manual monthly file, prorated for partial
   months, flagged "partial" if any overlapped month hasn't been entered). */
function realAgg(rows){
  let amt = 0, count = 0, profit = 0;
  rows.forEach(r => { amt += r.amt; count++; if (r.entity === 'bec') profit += (r.profit || 0); });
  return { amt, count, profit };
}

function ansariGrossProfitForRange(start, end){
  if (!start || !end) return { value: null, partial: true };
  let total = 0, any = false, partial = false;
  let [y, m] = start.split('-').map(Number);
  const [ey, em] = end.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) {
    const key = monthKey(y, m);
    const dim = daysInMonth(y, m);
    const rangeStartDay = (y === Number(start.split('-')[0]) && m === Number(start.split('-')[1])) ? Number(start.split('-')[2]) : 1;
    const rangeEndDay = (y === ey && m === em) ? Number(end.split('-')[2]) : dim;
    const overlapDays = rangeEndDay - rangeStartDay + 1;
    const val = ANSARI_MONTHLY_GP[key];
    if (val === null || val === undefined) {
      partial = true;
    } else {
      any = true;
      total += val * (overlapDays / dim);
    }
    m++; if (m > 12){ m = 1; y++; }
  }
  return { value: any ? total : null, partial };
}

function aggregateForEntity(entity, { codes, cur, types, start, end }){
  const rows = filterRows(DATA, { entity, codes, cur, types, start, end });
  const agg = realAgg(rows);
  if (entity === 'ansari') {
    const gp = ansariGrossProfitForRange(start, end);
    agg.profit = gp.value;
    agg.profitPartial = gp.partial;
  }
  return agg;
}

function pctChangeOrNA(cur, prev){
  if (cur === null || prev === null || prev === undefined || cur === undefined) return null;
  if (!prev) return null;
  return (cur - prev) / prev * 100;
}

const MONTH_LABELS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function dailySeries(rows, start, end){
  const idx = {};
  rows.forEach(r => { (idx[r.date] = idx[r.date] || []).push(r); });
  const out = [];
  let [y, m, d] = start.split('-').map(Number);
  while (true){
    const ds = y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const agg = realAgg(idx[ds] || []);
    out.push({ label: m + '/' + d, date: ds, amt: agg.amt, count: agg.count, profit: agg.profit });
    if (ds === end) break;
    d++; const dim = daysInMonth(y, m); if (d > dim){ d = 1; m++; if (m > 12){ m = 1; y++; } }
  }
  return out;
}

function monthlySeries(rows, start, end){
  const idx = {};
  rows.forEach(r => { const k = r.date.slice(0,7); (idx[k] = idx[k] || []).push(r); });
  const out = [];
  let [y, m] = start.split('-').map(Number);
  const [ey, em] = end.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)){
    const k = y + '-' + String(m).padStart(2,'0');
    const agg = realAgg(idx[k] || []);
    out.push({ label: MONTH_LABELS[m-1] + (y === ey && m === em ? ' (MTD)' : ''), amt: agg.amt, count: agg.count, profit: agg.profit });
    m++; if (m > 12){ m = 1; y++; }
  }
  return out;
}

/* ---------- Overview cards ---------- */
function renderCards(){
  const range = periodRange(entityScope, currentTab);
  const scopeCode = summaryScope === 'ho' ? HO_CODE_BY_ENTITY[entityScope] : null;
  const codes = summaryScope === 'ho' ? [scopeCode] : codesForAreaFilter(entityScope, 'ALL');
  const opts = { codes, types: ['sell','buy'], start: range && range.start, end: range && range.end };
  const cur = range ? aggregateForEntity(entityScope, opts) : { amt:0, count:0, profit:null };
  const avgTicket = cur.count ? cur.amt / cur.count : 0;

  // MoM / YoY
  const prevM = prevMonthRange(entityScope);
  const prevY = prevYearSameRange(entityScope, currentTab);
  const prevOptsM = prevM ? { codes, types:['sell','buy'], start: prevM.start, end: prevM.end } : null;
  const prevOptsY = prevY ? { codes, types:['sell','buy'], start: prevY.start, end: prevY.end } : null;
  const prevMAgg = prevOptsM ? aggregateForEntity(entityScope, prevOptsM) : null;
  const prevYAgg = prevOptsY ? aggregateForEntity(entityScope, prevOptsY) : null;
  // Ansari has no 2025 data at all -> YoY always N/A for ansari
  const yoyAvailable = entityScope === 'bec';

  const deltas = currentTab === 'mtd'
    ? { amt: pctChangeOrNA(cur.amt, prevMAgg && prevMAgg.amt), count: pctChangeOrNA(cur.count, prevMAgg && prevMAgg.count), profit: pctChangeOrNA(cur.profit, prevMAgg && prevMAgg.profit) }
    : { amt: yoyAvailable ? pctChangeOrNA(cur.amt, prevYAgg && prevYAgg.amt) : null, count: yoyAvailable ? pctChangeOrNA(cur.count, prevYAgg && prevYAgg.count) : null, profit: yoyAvailable ? pctChangeOrNA(cur.profit, prevYAgg && prevYAgg.profit) : null };
  const deltaLabel = currentTab === 'mtd' ? 'MoM' : 'YoY';

  const subFor = key => {
    const pct = deltas[key];
    if (pct === null || pct === undefined) return { text: 'N/A ' + deltaLabel, cls: '' };
    const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
    return { text: `${fmtPct(pct)} ${deltaLabel}`, cls };
  };

  const lastMonth = prevMonthRange(entityScope);
  const activeBranches = activeBranchesFor(entityScope, lastMonth);
  const locationsVal = summaryScope === 'ho' ? '1' : activeBranches.length.toLocaleString();
  const locationsSub = summaryScope === 'ho' ? 'Head Office / Wholesale' : (entityHasAreas(entityScope) ? 'Active last month, across ' + AREA_LIST.length + ' areas' : 'Active last month');

  const profitText = cur.profit === null ? 'N/A' : fmtCurrency(cur.profit);

  const defs = [
    ['Volume (KWD)', fmtCurrency(cur.amt), subFor('amt')],

    ['Gross Profit (KWD)', profitText, profitSub],
    [summaryScope === 'ho' ? 'Location' : 'Branch Locations', locationsVal, { text: locationsSub, cls: '' }],
    ['Avg Ticket Size', fmtCurrency(avgTicket) + ' KWD', { text: '', cls: '' }]
  ];

  const el = document.getElementById('cards');
  el.innerHTML = defs.map(([label, val, sub], i) => `
      <div class="card grad-${i % 5}">
        <div class="label">${label}</div>
        <div class="value">${val}</div>
        <div class="sub ${sub.cls}">${sub.text}</div>
      </div>`).join('');
}

/* ---------- Branch FX Performance Comparison (excludes Head Office; top 10 default) ---------- */
let branchChartInstance = null;
let branchMetric = 'amt';
let branchAreaFilter = 'ALL';
let branchBranchFilter = 'ALL';
let branchTxnTypes = new Set(['sell', 'buy']);

function branchRowsFor(range, areaFilter, types){
  const list = branchListFor(entityScope).filter(b => areaFilter === 'ALL' || b.area === areaFilter);
  return list.map(b => {
    const rows = range ? filterRows(DATA, { entity: entityScope, codes: [b.code], types, start: range.start, end: range.end }) : [];
    const agg = realAgg(rows);
    if (entityScope === 'ansari') agg.profit = null;
    return { code: b.code, name: b.name, area: b.area, ...agg };
  });
}

function renderBranchPanel(){
  document.getElementById('branchHint').textContent = currentTab === 'mtd' ? 'Month to date (real data)' : 'Year to date (real data)';
  const range = periodRange(entityScope, currentTab);
  const hasAreas = entityHasAreas(entityScope);

  const areaSelect = document.getElementById('branchAreaSelect');
  areaSelect.innerHTML = hasAreas
    ? ['ALL', ...AREA_LIST].map(a => `<option value="${a}">${a === 'ALL' ? 'All Areas' : a}</option>`).join('')
    : '<option value="ALL">All Branches</option>';
  areaSelect.value = branchAreaFilter;
  areaSelect.disabled = !hasAreas;
  areaSelect.onchange = () => { branchAreaFilter = areaSelect.value; branchBranchFilter = 'ALL'; renderBranchPanel(); };

  const branchesInArea = branchListFor(entityScope).filter(b => branchAreaFilter === 'ALL' || b.area === branchAreaFilter);
  const branchLabel = branchAreaFilter === 'ALL' ? 'Top 10 Branches' : 'Top 10 in ' + branchAreaFilter;
  const branchSelect = document.getElementById('branchBranchSelect');
  branchSelect.innerHTML = [['ALL', branchLabel], ...branchesInArea.map(b => [b.code, b.name])]
    .map(([key,label]) => `<option value="${key}">${label}</option>`).join('');
  branchSelect.value = branchBranchFilter;
  branchSelect.onchange = () => { branchBranchFilter = branchSelect.value; renderBranchPanel(); };

  renderTxnTypeToggle('branchTxnTypeRow', branchTxnTypes, renderBranchPanel);

  const metricRow = document.getElementById('branchMetricRow');
  metricRow.innerHTML = '';
  metricOptionsFor(entityScope).forEach(([key,label]) => {
    const btn = document.createElement('button');
    btn.className = 'pill-btn' + (branchMetric === key ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => { branchMetric = key; renderBranchPanel(); };
    metricRow.appendChild(btn);
  });
  if (entityScope !== 'bec' && branchMetric === 'profit') branchMetric = 'amt';

  const types = [...branchTxnTypes];
  const allRows = branchRowsFor(range, branchAreaFilter, types).sort((a,b) => (b[branchMetric]||0) - (a[branchMetric]||0));
  const rows = branchBranchFilter === 'ALL' ? allRows.slice(0, 10) : allRows.filter(r => r.code === branchBranchFilter);
  const total = allRows.reduce((a,r) => ({ amt:a.amt+r.amt, count:a.count+r.count, profit: entityScope==='bec' ? a.profit+(r.profit||0) : null }), { amt:0, count:0, profit: entityScope==='bec'?0:null });

  const ctx = document.getElementById('branchChart').getContext('2d');
  if (branchChartInstance) branchChartInstance.destroy();
  branchChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: rows.map(r => r.name),
      datasets: [{ data: rows.map(r => r[branchMetric] || 0), backgroundColor: rows.map((_,i) => PALETTE[i % PALETTE.length]), borderRadius: 4, maxBarThickness: 26 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => METRIC_META[branchMetric].fmt(c.parsed.x) } } },
      scales: {
        y: { grid: { display: false }, ticks: { color: '#8A93AA', font: { family: 'Inter', size: 10.5 } } },
        x: { grid: { color: '#242E47' }, ticks: { color: '#8A93AA', font: { family: 'JetBrains Mono', size: 10 } } }
      }
    }
  });

  const cols = metricOptionsFor(entityScope);
  const head = document.getElementById('branchTableHead');
  head.innerHTML = '<th>Branch</th>' + (hasAreas ? '<th>Area</th>' : '') + cols.map(([k,l]) => `<th>${l}</th>`).join('');
  const body = document.getElementById('branchTableBody');
  const totalLabel = branchAreaFilter === 'ALL' ? 'Branch Network Total' : branchAreaFilter + ' Total';
  body.innerHTML = rows.map(r => `<tr><td>${r.name}</td>${hasAreas ? `<td>${r.area||''}</td>` : ''}${cols.map(([k]) => `<td>${METRIC_META[k].fmt(r[k])}</td>`).join('')}</tr>`).join('')
    + `<tr class="total-row"><td>${totalLabel}</td>${hasAreas ? '<td></td>' : ''}${cols.map(([k]) => `<td>${METRIC_META[k].fmt(total[k])}</td>`).join('')}</tr>`;
}

/* ---------- Branch Currency-wise Comparison ---------- */
let curChartInstance = null;
let curAreaFilter = 'ALL';
let curBranchFilter = 'ALL';
let curMetric = 'amt';
let curTxnTypes = new Set(['sell', 'buy']);

function renderCurrencyPanel(){
  document.getElementById('curHint').textContent = currentTab === 'mtd' ? 'Month to date (real data)' : 'Year to date (real data)';

  branchSelect.onchange = () => { curBranchFilter = branchSelect.value; renderCurrencyPanel(); };

  renderTxnTypeToggle('curTxnTypeRow', curTxnTypes, renderCurrencyPanel);

  metricRow.innerHTML = '';
  metricOptionsFor(entityScope).forEach(([key,label]) => {
    const btn = document.createElement('button');
    btn.className = 'pill-btn gold' + (curMetric === key ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => { curMetric = key; renderCurrencyPanel(); };
    metricRow.appendChild(btn);
  });
  if (entityScope !== 'bec' && curMetric === 'profit') curMetric = 'amt';

  const scopeCodes = curBranchFilter === 'ALL' ? codesForAreaFilter(entityScope, curAreaFilter) : [curBranchFilter];
  const types = [...curTxnTypes];
  const scopeRecords = range ? filterRows(DATA, { entity: entityScope, codes: scopeCodes, types, start: range.start, end: range.end }) : [];
  const curs = [...new Set(scopeRecords.map(r => r.cur))];
  const rows = curs.map(cur => {

    return { cur, ...agg };
  }).sort((a,b) => (b[curMetric]||0) - (a[curMetric]||0));

  const ctx = document.getElementById('curChart').getContext('2d');

  curChartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels: top.map(r => r.cur), datasets: [{ data: top.map(r => r[curMetric] || 0), backgroundColor: top.map((_,i) => PALETTE[i % PALETTE.length]), borderRadius: 4, maxBarThickness: 34 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => METRIC_META[curMetric].label + ': ' + METRIC_META[curMetric].fmt(c.parsed.y) } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#8A93AA', font: { family: 'Inter', size: 11 } } },
        y: { grid: { color: '#242E47' }, ticks: { color: '#8A93AA', font: { family: 'JetBrains Mono', size: 10 } } }
      }
    }
  });

  const cols = metricOptionsFor(entityScope);
  const head = document.getElementById('curTableHead');
  head.innerHTML = '<th>Currency</th>' + cols.map(([k,l]) => `<th>${l}</th>`).join('');
  const body = document.getElementById('curTableBody');
  const totals = rows.reduce((a,r) => ({ amt:a.amt+r.amt, count:a.count+r.count, profit: entityScope==='bec' ? a.profit+(r.profit||0) : null }), { amt:0, count:0, profit: entityScope==='bec'?0:null });
  body.innerHTML = rows.map(r => `<tr><td>${r.cur}</td>${cols.map(([k]) => `<td>${METRIC_META[k].fmt(r[k])}</td>`).join('')}</tr>`).join('')
    + `<tr class="total-row"><td>All Currencies</td>${cols.map(([k]) => `<td>${METRIC_META[k].fmt(totals[k])}</td>`).join('')}</tr>`;
}

/* ---------- Init ---------- */
function toggleSection(key){
  const body = document.getElementById(key + 'Body');
  const icon = document.getElementById(key + 'Icon');
  const collapsing = !body.classList.contains('collapsed');
  body.classList.toggle('collapsed');
  icon.textContent = collapsing ? '+' : '\u2212';
  if (!collapsing){
    if (key === 'ho') renderHOPanel();
    if (key === 'trend') renderTrendPanel();
    if (key === 'curTrend') renderCurrencyTrendPanel();
    if (key === 'branch') renderBranchPanel();
    if (key === 'cur') renderCurrencyPanel();
  }
}

function renderAll(){
  renderEntityTabs();
  buildTabs();
  renderSummaryScopeTabs();
  renderCards();
  renderHOPanel();
  renderTrendPanel();
  renderCurrencyTrendPanel();
  renderBranchPanel();
  renderCurrencyPanel();
}

loadAll();
