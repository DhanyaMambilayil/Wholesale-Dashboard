<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesale Desk Dashboard</title>

<!--
  =====================================================================
  ABOUT THIS FILE
  =====================================================================
  Built from your uploaded FCY Surveillance Report (21-JUL-2026), which
  contains one full day of real branch-level transaction data (364 rows,
  33 codes incl. Head Office, 26 currencies) — search "txn-data" below.

  ASSUMPTIONS MADE WHILE BUILDING THIS — please confirm or correct:
  1. There's no separate "current date" tab anymore — Month to Date and
     Year to Date are both simulated, scaled from the one real day of
     data (per your instruction), so this dashboard now always shows
     projected figures rather than a raw daily snapshot.
  2. MoM% (next to the Month to Date tab) and YoY% (next to Year to Date)
     are also simulated — there's no real prior-month or prior-year data,
     so a comparable synthetic total was generated the same way as the
     current period and the % change is computed against that.
  3. Head Office (code 9999) is the wholesale desk itself. Its panel now
     also compares Head Office volume against total Branch Network
     volume per currency (grouped bars), so you can see the wholesale
     vs. retail split directly. The panel's table can be minimized with
     the "Hide table" link.
  4. Branch comparison and Branch Currency-wise Comparison both exclude
     Head Office and cover the 35 branches across your 3 areas (SHABIR,
     SAKEER, ANOOP). Branch comparison no longer shows Active Customers
     per branch (Volume and Transactions only). Branch Currency-wise
     Comparison uses Area/Branch dropdowns and defaults to all branches
     (excluding Head Office).
  5. The old "Branch performance by currency" matrix panel and the
     "Customer & channel mix" panel have been removed per your request.
  6. "Volume" = Txn Amount (the KWD-equivalent local currency amount).
  7. Added BEC / ANSARI entity tabs above Month to Date / Year to Date,
     defaulting to ANSARI (the uploaded report is for Al Ansari
     Exchange, and its figures are unchanged from before). There's no
     real BEC data at all, so BEC's entire scale is simulated as ~42%
     of Ansari's figures (a fixed, made-up ratio — replace with real
     BEC data as soon as it's available).
  =====================================================================
-->

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"><\/script>');
  }
</script>

<style>
  :root{
    --bg:#181F39; --panel:#1E2746; --ink:#EAEFF9; --ink-soft:#8891AC; --line:#2A3560;
    --navy:#22335E;
    --accent:#3A7AFE; --accent-soft:#233258;
    --blue:#3A7AFE; --blue-soft:#1E2E52;
    --gold:#10CA93; --gold-soft:#173C34;
    --purple:#00AFEF; --purple-soft:#123449;
    --positive:#10CA93; --positive-soft:#173C34;
    --red:#FF5C5C; --red-soft:#3A1B1B;
    --orange:#FF8A3D;
    --radius:12px;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --display:'Space Grotesk', var(--sans);
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg) radial-gradient(circle at 15% 0%, var(--blue-soft) 0%, transparent 50%), radial-gradient(circle at 100% 5%, var(--gold-soft) 0%, transparent 22%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1260px;margin:0 auto;padding:28px 20px 64px;}

  header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:18px;}
  .title-block h1{
    font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-0.02em;margin:0 0 4px;
    color:#001844;text-shadow:0 0 1px #fff, 0 0 14px rgba(255,255,255,.55);
  }
  .title-block p{margin:0;color:var(--ink-soft);font-size:14px;}
  .badge{
    display:inline-flex;align-items:center;gap:8px;background:var(--gold-soft);color:var(--gold);
    border:1px solid #1E5C4A;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;
  }

  .note{background:var(--accent-soft);border:1px solid #2E3E5C;color:var(--ink);border-radius:var(--radius);padding:13px 16px;font-size:13px;line-height:1.55;margin-bottom:22px;}
  .note b{font-weight:700;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab-btn{
    border:1px solid #001844;background:#fff;color:#001844;
    font-family:var(--display);font-weight:600;font-size:14px;
    padding:11px 22px;border-radius:999px;cursor:pointer;
  }
  .tab-btn.active{background:#001844;color:#fff;border-color:#001844;box-shadow:0 0 26px rgba(58,122,254,.45);}

  /* ---- Cards ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:0 2px 14px rgba(0,27,84,.05);}
  .card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
  .card .value{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-0.01em;}
  .card .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .card .sub.up{color:var(--positive);}
  .card .sub.down{color:var(--red);}

  .card.grad-0{background:#3A7AFE;border-color:transparent;box-shadow:0 0 26px rgba(58,122,254,.40);}
  .card.grad-1{background:#10CA93;border-color:transparent;box-shadow:0 0 26px rgba(16,202,147,.35);}
  .card.grad-2{background:#00AFEF;border-color:transparent;box-shadow:0 0 26px rgba(0,175,239,.35);}
  .card.grad-3{background:#7C5CFC;border-color:transparent;box-shadow:0 0 26px rgba(124,92,252,.35);}
  .card.grad-4{background:#5B8FBF;border-color:transparent;box-shadow:0 0 26px rgba(91,143,191,.30);}
  .card[class*="grad-"] .label{color:rgba(255,255,255,.78);}
  .card[class*="grad-"] .value{color:#fff;}
  .card[class*="grad-"] .sub{color:rgba(255,255,255,.75);}
  .card[class*="grad-"] .sub.up{color:#082418;font-weight:700;}
  .card[class*="grad-"] .sub.down{color:#2E0808;font-weight:700;}

  /* ---- Panels ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .panel h2{font-family:var(--display);font-size:19px;font-weight:700;color:var(--orange);text-shadow:0 0 14px rgba(255,138,61,.45);letter-spacing:-0.01em;margin:0 0 16px;padding-left:12px;border-left:4px solid var(--orange);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .panel h2.accordion-head{cursor:pointer;margin:0;}
  .accordion-icon{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--orange);color:#3A1F00;font-size:16px;font-weight:700;
    box-shadow:0 0 14px rgba(255,138,61,.5);
  }
  .panel-body{margin-top:16px;}
  .panel-body.collapsed{display:none;}
  .panel h2 .hint{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--ink-soft);}
  .chart-wrap{position:relative;height:300px;}
  .chart-wrap.tall{height:340px;}

  /* ---- Leaderboard ---- */
  .lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .lb-col-title{font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
  .lb-card{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;
    border:1px solid var(--line);margin-bottom:10px;background:var(--panel);
    transition:box-shadow .15s ease;
  }
  .lb-card.rank-1{border-color:#1E5C4A;box-shadow:0 0 26px rgba(16,202,147,.30);}
  .lb-card.rank-2{box-shadow:0 0 16px rgba(0,27,84,.10);}
  .lb-rank{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:15px;
  }
  .lb-rank.r1{background:var(--gold);color:#fff;box-shadow:0 0 18px rgba(16,202,147,.65);}
  .lb-rank.r2{background:#3A4560;color:#DCE3F0;}
  .lb-rank.r3{background:#5A4326;color:#F0DDBB;}
  .lb-rank.rn{background:var(--accent-soft);color:var(--ink);}
  .lb-body{flex:1;min-width:0;}
  .lb-top-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .lb-name{font-weight:700;font-family:var(--display);font-size:14.5px;color:var(--ink);}
  .lb-value{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;}
  .lb-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .lb-bar-wrap{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px;}
  .lb-bar-fill{height:100%;border-radius:999px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);}
  @media (max-width:640px){ .lb-grid{grid-template-columns:1fr;} }

  /* ---- Pill switchers ---- */
  .pill-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .pill-btn{
    border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);
    font-family:var(--sans);font-weight:600;font-size:12.5px;
    padding:8px 14px;border-radius:999px;cursor:pointer;
  }
  .pill-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 16px rgba(58,122,254,.40);}
  .pill-btn.gold.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 18px rgba(58,122,254,.40);}

  /* ---- Tables ---- */
  .table-scroll{overflow:auto;border:1px solid var(--line);border-radius:8px;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px;}
  thead th{position:sticky;top:0;background:#1A2338;text-align:right;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;}
  thead th:first-child{text-align:left;}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink);}
  tbody td:first-child{text-align:left;font-family:var(--sans);font-weight:600;}
  tbody tr:hover td{background:var(--accent-soft);}
  tbody tr.total-row td{background:#1A2338;font-weight:700;}
  tbody tr:last-child td{border-bottom:none;}

  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:32px;}

  /* ---- Segmentation ---- */
  .seg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .seg-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;transition:box-shadow .15s ease;}
  .seg-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;}
  .seg-card-title{font-family:var(--display);font-weight:700;font-size:15px;}
  .seg-card-desc{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
  .seg-card-right{text-align:right;flex-shrink:0;}
  .seg-card-count{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink);}
  .seg-card-vol{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  @media (max-width:600px){
    .title-block h1{font-size:21px;}
    .card .value{font-size:19px;}
  }

  .filter-select{
    background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; font-family:var(--sans); font-size:12.5px; font-weight:600; margin-right:8px;
  }
  .table-toggle-btn{
    background:none; border:none; color:var(--accent); font-family:var(--sans); font-weight:600;
    font-size:12.5px; cursor:pointer; padding:0; margin-bottom:10px; display:inline-block;
  }

</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Wholesale Dashboard</h1>
      <p>Head Office &amp; Branch Network — Currency &amp; Area performance</p>
    </div>
  </header>

  <div class="tabs" id="entityTabs" style="margin-bottom:10px;"></div>
  <div class="tabs" id="tabs"></div>

<div id="periodView">
  <section class="cards" id="cards"></section>

  <section class="panel" id="hoPanel">
    <h2 class="accordion-head" onclick="toggleSection('ho')">
      <span>Head Office <span class="hint" style="font-weight:500;">vs Branch Network</span></span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="hint" id="hoHint"></span>
        <span class="accordion-icon" id="hoIcon">+</span>
      </span>
    </h2>
    <div class="panel-body collapsed" id="hoBody">
      <div class="tabs" id="hoScopeRow" style="margin-bottom:16px;"></div>
      <div class="cards" id="hoCards" style="margin-bottom:16px;"></div>
      <div class="pill-row" id="hoMetricRow"></div>
      <div class="chart-wrap"><canvas id="hoChart"></canvas></div>
      <button class="table-toggle-btn" id="hoTableToggleBtn" onclick="toggleHOTable()">Hide table ▴</button>
      <div id="hoTableWrap" class="table-scroll">
        <table id="hoTable">
          <thead><tr id="hoTableHead"></tr></thead>
          <tbody id="hoTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="panel" id="trendPanel">
    <h2 class="accordion-head" onclick="toggleSection('trend')">
      <span id="trendTitle">Trend</span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="hint" id="trendHint"></span>
        <span class="accordion-icon" id="trendIcon">+</span>
      </span>
    </h2>
    <div class="panel-body collapsed" id="trendBody">
      <div class="pill-row" id="trendScopeRow"></div>
      <div class="pill-row" id="trendMetricRow"></div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>
  </section>

  <section class="panel" id="curTrendPanel">
    <h2 class="accordion-head" onclick="toggleSection('curTrend')">
      <span id="curTrendTitle">Currency-wise Trend</span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="hint" id="curTrendHint"></span>
        <span class="accordion-icon" id="curTrendIcon">+</span>
      </span>
    </h2>
    <div class="panel-body collapsed" id="curTrendBody">
      <div style="margin-bottom:16px;">
        <select class="filter-select" id="curTrendSelect"></select>
      </div>
      <div class="pill-row" id="curTrendMetricRow"></div>
      <div class="chart-wrap"><canvas id="curTrendChart"></canvas></div>
    </div>
  </section>

  <section class="panel" id="branchPanel">
    <h2 class="accordion-head" onclick="toggleSection('branch')">
      <span>Branch comparison <span class="hint" style="font-weight:500;">(excl. Head Office)</span></span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="hint" id="branchHint"></span>
        <span class="accordion-icon" id="branchIcon">+</span>
      </span>
    </h2>
    <div class="panel-body collapsed" id="branchBody">
      <div class="pill-row" id="branchAreaRow"></div>
      <div class="pill-row" id="branchMetricRow"></div>
      <div class="chart-wrap tall"><canvas id="branchChart"></canvas></div>
      <div class="table-scroll" style="margin-top:16px;">
        <table id="branchTable">
          <thead><tr id="branchTableHead"></tr></thead>
          <tbody id="branchTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="panel" id="curPanel">
    <h2 class="accordion-head" onclick="toggleSection('cur')">
      <span>Branch Currency-wise Comparison</span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="hint" id="curHint"></span>
        <span class="accordion-icon" id="curIcon">+</span>
      </span>
    </h2>
    <div class="panel-body collapsed" id="curBody">
      <div style="margin-bottom:16px;">
        <select class="filter-select" id="curAreaSelect"></select>
        <select class="filter-select" id="curBranchSelect"></select>
      </div>
      <div class="pill-row" id="curMetricRow"></div>
      <div class="chart-wrap"><canvas id="curChart"></canvas></div>
      <div class="table-scroll" style="margin-top:16px;">
        <table id="curTable">
          <thead><tr id="curTableHead"></tr></thead>
          <tbody id="curTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

</div>

function hashSeed(str){ let h = 0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) | 0; return h; }
function seededRandom(seed){
  let t = seed;
  return function(){
    t |= 0; t = (t + 0x6D2B79F5) | 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function synthMultiplier(seedStr, base, spread){
  const rand = seededRandom(hashSeed(seedStr));
  return base + (rand() * 2 - 1) * spread;
}
function fmtCurrency(v){
  return v.toLocaleString(undefined, { maximumFractionDigits: 0 });

function fmtPct(n){
  if (n === null || n === undefined || isNaN(n)) return 'N/A';
  const sign = n > 0 ? '+' : '';
  return sign + n.toFixed(1) + '%';
}

// BEC has no real data in the uploaded report, so its whole scale is
// simulated as a fraction of Ansari's real figures — chosen once, fixed,
// so the relationship between the two entities stays consistent everywhere.
const BEC_FACTOR = 0.42;

function entityMultFor(entity){ return entity === 'bec' ? BEC_FACTOR : 1; }

function aggregateReal(records){
  const sids = new Set();
  let amt = 0, cash = 0, noncash = 0;
  records.forEach(r => {
    amt += r.amt;
    sids.add(r.sid);
    if (r.pm === 'C') cash += r.amt; else noncash += r.amt;
  });
  return { amt, count: records.length, active: sids.size, cash, noncash };
}

// Generic scaled aggregator: real records for a given scope, scaled to the
// selected period by a deterministic seeded multiplier so results stay
// stable across re-renders. `seedKey` should uniquely identify the scope.
// Entity-aware: BEC has no real data, so its baseline is Ansari's real
// figures scaled by BEC_FACTOR before the period multiplier is applied;
// Consolidated sums the Ansari and BEC results.
function aggregateScopeForEntity(records, seedKey, period, entity){
  const real = aggregateReal(records);
  const eMult = entityMultFor(entity);
  const adjReal = {
    amt: real.amt * eMult, count: Math.round(real.count * eMult),
    active: Math.round(real.active * Math.sqrt(eMult)),
    cash: real.cash * eMult, noncash: real.noncash * eMult
  };
  if (period === 'today') return adjReal;
  const baseMult = period === 'mtd' ? TODAY_DAY_OF_MONTH : (TODAY_DAY_OF_MONTH + (MONTHS_ELAPSED_YTD - 1) * 22);
  const seed = entity + '|' + seedKey;
  const mult = synthMultiplier(seed + '|' + period, baseMult, baseMult * 0.28);
  const countMult = mult * synthMultiplier(seed + '|' + period + '|countAdj', 1, 0.1);
  const activeMult = Math.sqrt(mult) * synthMultiplier(seed + '|' + period + '|active', 1, 0.15);
  return {
    amt: Math.max(adjReal.amt * mult, adjReal.amt),
    count: Math.max(Math.round(adjReal.count * countMult), adjReal.count),
    active: Math.max(Math.round(adjReal.active * activeMult), adjReal.active),
    cash: adjReal.amt > 0 ? adjReal.cash * mult : 0,
    noncash: adjReal.amt > 0 ? adjReal.noncash * mult : 0
  };
}

function combineAggs(a, b){
  return { amt: a.amt+b.amt, count: a.count+b.count, active: a.active+b.active, cash: (a.cash||0)+(b.cash||0), noncash: (a.noncash||0)+(b.noncash||0) };
}

function aggregateScope(records, seedKey, period){
  return aggregateScopeForEntity(records, seedKey, period, entityScope);
}

// Comparison-period aggregator (prior month / prior year), scaled to the
// same "days elapsed" basis as the current period so the % change is a
// fair like-for-like comparison. Simulated, deterministic per seed.
function comparisonAggForEntity(records, seedKey, baseMult, entity){
  const real = aggregateReal(records);
  const eMult = entityMultFor(entity);
  const adjReal = { amt: real.amt * eMult, count: Math.round(real.count * eMult), active: Math.round(real.active * Math.sqrt(eMult)) };
  const seed = entity + '|' + seedKey;
  const mult = synthMultiplier(seed, baseMult, baseMult * 0.28);
  const countMult = mult * synthMultiplier(seed + '|countAdj', 1, 0.1);
  const activeMult = Math.sqrt(mult) * synthMultiplier(seed + '|active', 1, 0.15);
  return {
    amt: adjReal.amt * mult,
    count: Math.round(adjReal.count * countMult),
    active: Math.round(adjReal.active * activeMult)
  };
}

function comparisonAgg(records, seedKey, baseMult){
  return comparisonAggForEntity(records, seedKey, baseMult, entityScope);
}

function codesForAreaFilter(filter){

  if (filter === 'ALL') return branchList.map(b => b.code);
  if (AREA_LIST.includes(filter)) return branchList.filter(b => b.area === filter).map(b => b.code);

}

/* ---------- Tabs (Month to Date / Year to Date only) ---------- */
function pctChange(cur, prev){
  return prev ? (cur - prev) / prev * 100 : 0;
}

// Per-metric MoM (vs a comparable simulated prior month) and YoY (vs a
// comparable simulated prior year), for Volume, Transactions, and Active
// Customers. Simulated, deterministic per seed — there's no real prior
// period data to compare against.
function computeMoMYoY(){
  const mtdAgg = aggregateScope(DATA, 'network', 'mtd');
  const ytdAgg = aggregateScope(DATA, 'network', 'ytd');
  const prevMonthAgg = comparisonAgg(DATA, 'network|prevMonth', TODAY_DAY_OF_MONTH);
  const prevYearAgg = comparisonAgg(DATA, 'network|prevYear', TODAY_DAY_OF_MONTH + (MONTHS_ELAPSED_YTD - 1) * 22);
  return {
    mom: { amt: pctChange(mtdAgg.amt, prevMonthAgg.amt), count: pctChange(mtdAgg.count, prevMonthAgg.count), active: pctChange(mtdAgg.active, prevMonthAgg.active) },
    yoy: { amt: pctChange(ytdAgg.amt, prevYearAgg.amt), count: pctChange(ytdAgg.count, prevYearAgg.count), active: pctChange(ytdAgg.active, prevYearAgg.active) }
  };
}

    ['Active Customers', Math.round(cur.active).toLocaleString(), subFor('active')],

function dailyTrendSynthMTDForEntity(records, seedPrefix, entity){
  const eMult = entityMultFor(entity);
  const todayReal = aggregateReal(records);
  const todayAgg = { amt: todayReal.amt * eMult, count: Math.round(todayReal.count * eMult) };
  const seed = entity + '|' + seedPrefix;
  const days = [];
  for (let d = 1; d <= TODAY_DAY_OF_MONTH; d++){
    if (d === TODAY_DAY_OF_MONTH){
      days.push({ label: 'Jul ' + d, amt: todayAgg.amt, count: todayAgg.count });
      continue;
    }
    const dow = new Date(2026, 6, d).getDay(); // 5=Fri, 6=Sat (Kuwait weekend)
    const weekendDip = (dow === 5 || dow === 6) ? 0.55 : 1;
    const mult = synthMultiplier(seed + '|day' + d, 1, 0.35) * weekendDip;
    days.push({ label: 'Jul ' + d, amt: Math.max(todayAgg.amt * mult, 0), count: Math.max(Math.round(todayAgg.count * mult), 0) });
  }
  return days;
}

function dailyTrendSynthMTD(records, seedPrefix){
  return dailyTrendSynthMTDForEntity(records, seedPrefix, entityScope);
}

function monthlyTrendSynthYTDForEntity(records, seedPrefix, entity){
  const daily = dailyTrendSynthMTDForEntity(records, seedPrefix, entity);
  const julTotal = { amt: daily.reduce((a,d)=>a+d.amt,0), count: daily.reduce((a,d)=>a+d.count,0) };
  const eMult = entityMultFor(entity);
  const avgDailyReal = aggregateReal(records);
  const avgDaily = { amt: avgDailyReal.amt * eMult, count: Math.round(avgDailyReal.count * eMult) };
  const seed = entity + '|' + seedPrefix;
  return MONTH_LABELS.map((label, i) => {
    if (i === MONTH_LABELS.length - 1) return { label: label + ' (MTD)', amt: julTotal.amt, count: julTotal.count };
    const mult = synthMultiplier(seed + '|month' + label, 22, 22 * 0.3);
    return { label, amt: avgDaily.amt * mult, count: Math.round(avgDaily.count * mult) };
  });
}

function monthlyTrendSynthYTD(records, seedPrefix){
  return monthlyTrendSynthYTDForEntity(records, seedPrefix, entityScope);
}

function toggleSection(key){
  const body = document.getElementById(key + 'Body');
  const icon = document.getElementById(key + 'Icon');
  const collapsing = !body.classList.contains('collapsed');
  body.classList.toggle('collapsed');
  icon.textContent = collapsing ? '+' : '\u2212';
  if (!collapsing){
    if (key === 'ho') renderHOPanel();
    if (key === 'trend') renderTrendPanel();
    if (key === 'curTrend') renderCurrencyTrendPanel();
    if (key === 'branch') renderBranchPanel();
    if (key === 'cur') renderCurrencyPanel();
  }
}

function renderAll(){
  renderEntityTabs();
  buildTabs();
  renderCards();
  renderHOPanel();
  renderTrendPanel();
  renderCurrencyTrendPanel();
  renderBranchPanel();
  renderCurrencyPanel();
}
